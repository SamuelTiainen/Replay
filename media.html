
<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oma media</title>

    <link rel="stylesheet" href="assets/style.css">

    <script src="assets/js/layout.js" defer></script>
    <script src="assets/js/media.js" defer></script>
</head>

<body>

    <div id="header-placeholder"></div>

    <main id="main">

        <section class="media-page">

            <div class="media-header">
                <h1 class="replay-title">Oma media</h1>

                <h2 id="event-name">Valittu tapahtuma</h2>

                <p>
                    Urheilija:
                    <strong id="athlete-name"></strong>
                </p>

                <p id="selected-product"></p>
            </div>

            <!-- Median suodatus ja järjestys -->
            <div class="media-toolbar">

                <label>
                    Media
                    <select id="kind">
                        <option value="all">Kaikki</option>
                        <option value="photo">Valokuvat</option>
                        <option value="video">Videot</option>
                    </select>
                </label>

                <label>
                    Järjestys
                    <select id="order">
                        <option value="new">Uusimmat ensin</option>
                        <option value="old">Vanhimmat ensin</option>
                    </select>
                </label>

            </div>

            <!-- Mediagalleria -->
            <div id="media-container" class="media-gallery">
                <p>Ladataan ostettuja medioita...</p>
            </div>

            <!-- Median suurennusikkuna -->
            <dialog id="media-viewer" class="media-viewer">

                <button type="button" id="close-viewer" class="close-viewer">
                    Sulje ✕
                </button>

                <div id="viewer-content" class="viewer-content"></div>

            </dialog>

        </section>

    </main>

    <div id="footer-placeholder"></div>

</body>
</html>
