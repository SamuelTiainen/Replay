
<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Striimaamo</title>

    <link rel="stylesheet" href="assets/style.css">

    <script src="assets/js/layout.js" defer></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <main id="main">

<div>
    <h1 class="replay-title">Replay</h1>

    <div class="form-card">

        <form action="media.html" method="GET">

            <!-- Tapahtuma -->
            <div class="form-group">
                <label for="fname">Tapahtuma</label>
                <input type="text" id="fname" name="tapahtuma" required>
            </div>

            <!-- Urheilija -->
            <div class="form-group">
                <label for="lname">Urheilija</label>
                <input type="text" id="lname" name="urheilija" required>
            </div>

            <h3>Valitse tuote:</h3>

            <!-- Tuotteet -->
            <div class="product-options">
                <label class="radio-option">
                    <input type="radio" name="tuote" value="kuva" required>
                    1 Kuva 10€
                </label>

                <label class="radio-option">
                    <input type="radio" name="tuote" value="video">
                    1 Video 10€
                </label>
                <label class="radio-option">
                    <input type="radio" name="tuote" value="kuva_video">
                    1 Kuva + 1 video 20€
                </label>

                <label class="radio-option">
                    <input type="radio" name="tuote" value="2kuvaa_2videota">
                    2 kuvaa + 2 videota 30€
                </label>
            </div>

            <button type="submit" class="btn btn-primary nav-cta">
    Osta
</button>

        </form>

    </div>
</div>


    </main>


    <div id="footer-placeholder"></div>

</body>
</html>
